version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./sample_data:/app/sample_data
      - ./uploaded_files:/app/uploaded_files
    environment:
      - DATABASE_URL=sqlite:///./coaliq.db
      - PYTHONPATH=/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
